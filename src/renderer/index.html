<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>betterboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">betterboard</span>
    </div>

    <div class="topbar-center">
      <div class="group">
        <button id="tool-pen" class="tool" title="Pen (B)">
          <svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.2L15.8 5.2a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8.2 18.8 4 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 7.5l3 3" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button id="tool-eraser" class="tool" title="Eraser (E)">
          <svg viewBox="0 0 24 24"><path d="M8.5 18.5H19M4.6 14.6a2 2 0 0 1 0-2.8l7-7a2 2 0 0 1 2.8 0l4.8 4.8a2 2 0 0 1 0 2.8l-6.1 6.1H9.5l-4.9-3.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 8.6l7.4 7.4" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button id="tool-select" class="tool" title="Select (S) — lasso an area, then drag it. ⌫ deletes, Esc deselects">
          <svg viewBox="0 0 24 24"><path d="M12 3.6c4.4 0 8 2.5 8 5.6s-3.6 5.6-8 5.6-8-2.5-8-5.6 3.6-5.6 8-5.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.6 2.8" stroke-linecap="round"/><path d="M8.2 14.2c-.9 1.6-.7 3 .4 3.7a1.7 1.7 0 1 1-1.6 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button id="tool-hand" class="tool" title="Hand — pan (H or Space)">
          <svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-4.5a1.5 1.5 0 0 1 3 0V11m0-3.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7l-2.4-3.6a1.5 1.5 0 0 1 2.4-1.8L7 14V7a1.5 1.5 0 0 1 3 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="sep"></div>

      <div class="group" id="swatches"></div>
      <label class="color-well" title="Custom color">
        <input type="color" id="color-input" value="#e8eaed" />
      </label>

      <div class="sep"></div>

      <div class="group size-group" title="Stroke size ( [ and ] )">
        <input type="range" id="size-input" min="1" max="28" step="1" value="6" />
        <span class="size-preview"><span id="size-dot"></span></span>
      </div>
    </div>

    <div class="topbar-right">
      <div class="group">
        <button id="undo" class="tool" title="Undo (⌘Z)" disabled>
          <svg viewBox="0 0 24 24"><path d="M8.5 7L4.5 11l4 4M5 11h9a5 5 0 0 1 0 10h-3" transform="translate(0 -2.5)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="redo" class="tool" title="Redo (⇧⌘Z)" disabled>
          <svg viewBox="0 0 24 24"><path d="M15.5 7l4 4-4 4M19 11h-9a5 5 0 0 0 0 10h3" transform="translate(0 -2.5)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="sep"></div>
      <div class="group">
        <button id="grid-btn" class="tool" title="Dot grid (⌘G)">
          <svg viewBox="0 0 24 24"><g fill="currentColor"><circle cx="6" cy="6" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="18" cy="6" r="1.4"/><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/><circle cx="6" cy="18" r="1.4"/><circle cx="12" cy="18" r="1.4"/><circle cx="18" cy="18" r="1.4"/></g></svg>
        </button>
        <button id="theme-btn" class="tool" title="Light/dark board (⇧⌘L)">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button id="layers-btn" class="tool" title="Layers (L or ⌘L)">
          <svg viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.3-8.5 4.3-8.5-4.3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4.4 12.2L12 16l7.6-3.8M4.4 16.2L12 20l7.6-3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <canvas id="board"></canvas>

  <aside id="layers" class="layers hidden">
    <header class="layers-head">
      <span class="layers-title">Layers</span>
      <button id="layer-add" class="mini" title="New layer (⌥⌘N)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div id="layer-list" class="layer-list"></div>
    <footer class="layers-foot">
      <div class="layer-opacity">
        <input type="range" id="layer-opacity" min="0" max="100" step="1" value="100" title="Layer opacity" />
        <span id="layer-opacity-val">100%</span>
      </div>
      <button id="layer-delete" class="mini" title="Delete layer and its strokes">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5.5A1.5 1.5 0 0 1 11.5 4h1A1.5 1.5 0 0 1 14 5.5V7m-7 0l.8 11.1A1.9 1.9 0 0 0 9.7 20h4.6a1.9 1.9 0 0 0 1.9-1.9L17 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </footer>
  </aside>

  <div id="rot-wheel" class="rot-wheel hidden" title="Drag to rotate · double-click to reset">
    <div class="rot-ring"></div>
    <div id="rot-knob"></div>
    <div id="rot-label">0°</div>
  </div>

  <div class="zoom-pill">
    <button id="zoom-out" title="Zoom out (⌘−)">−</button>
    <button id="zoom-label" title="Reset zoom (⌘0)">100%</button>
    <button id="zoom-in" title="Zoom in (⌘+)">+</button>
    <button id="normalize" title="Normalize — make this zoom the new 100% and regain full zoom range (⇧⌘N)">
      <svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
